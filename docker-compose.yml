services:
  mykafka:
    image: confluentinc/cp-kafka:latest
    container_name: mykafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@mykafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://mykafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    # restart: unless-stopped
    networks:
      - backend

  mymongodb:
    image: mongo:latest
    container_name: mymongodb
    ports:
      - "27017:27017"
    volumes:
      - /home/meudm/Desktop/Eyego-Task/data:/data/db
    restart: unless-stopped
    networks:
      - backend

  myserver:
    image: log-service:v1.0
    container_name: myserver
    depends_on:
      - mykafka
      - mymongodb
    ports:
      - "3000:3000"
    networks:
      - backend

networks:
  backend:
    driver: bridge
